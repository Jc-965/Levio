name: Pull Request Checks

on:
  pull_request:
    branches: [main, develop, testing, staging, production]
  push:
    branches: [main, develop, testing, staging, production]

env:
  FLUTTER_VERSION: '3.44.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check public repository safety
        run: bash scripts/check-public-repo.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: |
          flutter pub get
          dart pub get --directory packages/motion_engine

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Test motion engine package
        run: dart test
        working-directory: packages/motion_engine

      - name: Analyze code
        run: flutter analyze --fatal-infos

      - name: Check for outdated dependencies
        run: flutter pub outdated
        continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

  cloud-backend:
    name: Backend and Cloud Checks
    runs-on: ubuntu-latest
    needs: analyze
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Execute Supabase schema against Postgres
        env:
          PGPASSWORD: postgres
        run: |
          # Stub the Supabase-provided auth schema and roles, then execute
          # the real schema twice: once fresh, once to prove idempotency.
          # Grep checks cannot catch ordering bugs; only running it can.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create or replace function auth.uid() returns uuid
            language sql as $$ select null::uuid $$;
          create or replace function auth.jwt() returns jsonb
            language sql as $$ select '{}'::jsonb $$;
          do $$ begin
            if not exists (select from pg_roles where rolname = 'authenticated')
              then create role authenticated; end if;
            if not exists (select from pg_roles where rolname = 'anon')
              then create role anon; end if;
            if not exists (select from pg_roles where rolname = 'service_role')
              then create role service_role; end if;
          end $$;
          SQL
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -q -f supabase/schema.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -q -f supabase/schema.sql

      - name: Analyze cloud backend sources
        run: |
          flutter analyze --fatal-infos \
            lib/config/backend_config.dart \
            lib/services/cloud_backend_service.dart \
            lib/singleton.dart

      - name: Test Supabase dart-define configuration
        run: |
          flutter test test/cloud_backend_config_test.dart \
            --dart-define=BACKEND_PROVIDER=supabase \
            --dart-define=SUPABASE_URL=https://example.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=ci-placeholder-anon-key

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [analyze, test, cloud-backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [analyze, test, cloud-backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS simulator (debug)
        run: flutter build ios --simulator --debug
